name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue? Don't file it here.** See SECURITY.md to report privately.
        Never paste private keys, seed phrases or `.env` contents.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app (vercel/), Contracts (dex/), Rust demo (src/), Docs, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See error"
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Network / page / tx hash (if relevant)
      placeholder: Base Sepolia, /dex.html, 0x...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
