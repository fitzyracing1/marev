name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  dex:
    name: Hardhat tests (dex)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dex/package-lock.json
      - run: npm ci
      # Runs on Hardhat's in-memory network only. No keys, no RPC, nothing deployed.
      - run: npx hardhat test
